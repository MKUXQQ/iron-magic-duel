plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('runs')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { args '--nogui' }
    }
}
repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    flatDir { dirs 'libs' }
    mavenCentral()
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("local:irons:3.16.1")
    implementation fg.deobf("local:curios:5.14.1")
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
tasks.withType(Test).configureEach { enabled = false; useJUnitPlatform() }
tasks.register('resolverTest', JavaExec) { classpath = sourceSets.test.runtimeClasspath; mainClass = 'com.example.scrollspellicons.client.ScrollIconResolverSelfTest' }
tasks.register('performanceSelfTest', JavaExec) { classpath = sourceSets.test.runtimeClasspath; mainClass = 'com.example.scrollspellicons.server.PerformanceSelfTest' }
tasks.register('positionSmoothingSelfTest', JavaExec) { classpath = sourceSets.test.runtimeClasspath; mainClass = 'com.example.scrollspellicons.client.PositionSmootherSelfTest' }
tasks.register('spellGravitySelfTest', JavaExec) { classpath = sourceSets.test.runtimeClasspath; mainClass = 'com.example.scrollspellicons.server.SpellGravityStateSelfTest' }
tasks.named('check') { dependsOn 'resolverTest', 'performanceSelfTest', 'positionSmoothingSelfTest', 'spellGravitySelfTest' }

tasks.withType(ProcessResources).configureEach {
    var props = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}
